<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#080b16;font-family:"Instrument Sans",sans-serif;color:#e8edf7;position:relative}
  .glow{position:absolute;inset:0;background:
    radial-gradient(700px 480px at 88% 8%, rgba(79,191,149,.16), transparent 70%),
    radial-gradient(640px 420px at 70% 105%, rgba(233,184,114,.12), transparent 70%),
    radial-gradient(520px 420px at 0% 0%, rgba(125,159,214,.12), transparent 70%)}
  .grid{position:absolute;inset:0;background-image:
    linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:40px 40px;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 55%)}
  svg.chart{position:absolute;right:0;top:0}
  .copy{position:absolute;left:72px;top:68px;bottom:68px;width:600px;display:flex;flex-direction:column}
  .mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:10px}
  .brand{display:flex;align-items:center;gap:18px;font-size:30px;font-weight:600;letter-spacing:-.01em}
  .brand img{width:64px;height:64px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
  h1{margin:0;font-size:64px;line-height:1.04;font-weight:700;letter-spacing:-.025em}
  h1 em{font-style:normal;color:#e9b872}
  p{margin:26px 0 0;font-size:25px;line-height:1.4;color:#bbc8db;max-width:540px}
  .foot{position:absolute;left:72px;bottom:58px;display:flex;gap:12px}
  .chip{font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:500;padding:9px 16px;border-radius:999px;
    background:#151e33;border:1px solid #26314b;color:#bbc8db}
  .chip b{color:#4fbf95;font-weight:600}
  .stat{position:absolute;right:64px;top:74px;text-align:right;font-family:"IBM Plex Mono",monospace}
  .stat .k{font-family:"Instrument Sans";font-size:18px;color:#94a6bf}
  .stat .v{font-size:44px;font-weight:600;color:#e9b872;margin-top:4px;letter-spacing:-.01em}
</style></head>
<body>
<div class="glow"></div><div class="grid"></div>
<svg class="chart" width="1200" height="630" viewBox="0 0 1200 630" id="c"></svg>
<div class="copy">
  <div class="brand"><img src="../favicon.svg">RetCalc</div>
  <div class="mid"><h1 id="h"></h1>
  <p id="p"></p></div>
</div>

<script>
  const Q = new URLSearchParams(location.search);
  // No heading given: the site's own card (og.png), headline in two colors.
  if (Q.get('h')) document.getElementById('h').textContent = Q.get('h');
  else document.getElementById('h').innerHTML = 'Know <em>your number</em>.';
  document.getElementById('p').textContent = Q.get('p') ||
    'How much you need, when you can stop, and what you can safely spend each year. Every plan is tested against every market since 1926, with taxes and healthcare built in.';

  // Deterministic "historical paths" fan, like the site's balance chart.
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const svg = document.getElementById('c'), NS = 'http://www.w3.org/2000/svg';
  const x0 = 640, x1 = 1200, y0 = 560, N = 40, paths = [];
  for (let k = 0; k < 34; k++) {
    let v = 1, pts = [], drift = 0.03 + rnd() * 0.05;
    for (let i = 0; i <= N; i++) {
      pts.push(v);
      v *= 1 + drift + (rnd() - 0.5) * 0.22;
      if (i > 25) v *= 0.985;               // drawdown years bend the tail
    }
    paths.push(pts);
  }
  const fin = paths.map(p => Math.max(...p)).sort((a, b) => a - b), max = fin[Math.floor(fin.length * .8)];
  const Y = v => y0 - Math.sqrt(v / max) * 430, X = i => x0 + (x1 - x0) * i / N;
  const d = pts => pts.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
  const add = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
  const defs = add('defs', {});
  defs.innerHTML = `<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".25" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="m"><rect x="0" y="0" width="1200" height="630" fill="url(#fade)"/></mask>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fbf95" stop-opacity=".32"/><stop offset="1" stop-color="#4fbf95" stop-opacity="0"/></linearGradient>`;
  const g = add('g', { mask: 'url(#m)' });
  const addg = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); g.appendChild(e); return e; };
  for (const p of paths) addg('path', { d: d(p), fill: 'none', stroke: '#7d9fd6', 'stroke-opacity': .22, 'stroke-width': 1.4 });
  const med = []; for (let i = 0; i <= N; i++) { const col = paths.map(p => p[i]).sort((a, b) => a - b); med.push(col[Math.floor(col.length / 2)]); }
  addg('path', { d: d(med) + `L${x1} ${y0}L${x0} ${y0}Z`, fill: 'url(#area)' });
  addg('path', { d: d(med), fill: 'none', stroke: '#4fbf95', 'stroke-width': 4, 'stroke-linejoin': 'round' });
  addg('line', { x1: x0, x2: x1, y1: y0, y2: y0, stroke: '#26314b', 'stroke-width': 1.5 });
  const rx = X(25); addg('line', { x1: rx, x2: rx, y1: 120, y2: y0, stroke: '#e9b872', 'stroke-opacity': .55, 'stroke-width': 1.5, 'stroke-dasharray': '4 6' });
  addg('circle', { cx: rx, cy: Y(med[25]), r: 7, fill: '#e9b872', stroke: '#080b16', 'stroke-width': 3 });
</script>
</body></html>
