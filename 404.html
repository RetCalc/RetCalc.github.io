<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Retirement Calculator</title>
<script>
  /* GitHub Pages serves this file for any path it doesn't recognize, which
     is every clean tool URL (e.g. /incometax) since there's only one real
     page. Redirect to it with the real path packed into a query string;
     index.html's own head script unpacks it back into the address bar.
     https://github.com/rafgraph/spa-github-pages */
  var l = window.location;
  l.replace(
    l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") + "/?/" +
    l.pathname.slice(1).replace(/&/g, "~and~") +
    (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
    l.hash
  );
</script>
</head>
<body></body>
</html>
