# Runs on every push and pull request, as a second line of defense behind
# the local pre-commit hook (which isn't copied when the repo is cloned):
# the calculation tests against web/lib/engine, the figures baselines, lint
# and a production build. A red check here means a number on the site
# changed, or the build broke.
name: Calculation tests
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: python3 ../tests/run.py
      # Every tool's figures, and the readiness guide's for its fixture
      # households, unchanged; then the guide's own unit tests.
      - run: node scripts/baseline/numbers.mjs check
      - run: node scripts/baseline/guide.mjs check
      - run: npm run test:guide
      - run: npm run test:budget
      - run: npm run test:tax
      - run: npm run test:dashboard
      - run: npm run test:advanced
      - run: npm run lint
      - run: npm run build
