  <aside id="asideBR" hidden>
    <div class="panel inputs">
      <h2>Your situation</h2>
      <div class="body">
        <div class="two">
          <div class="field">
            <label for="brAge">Retire at<span class="tipdot" data-tip="brage" role="button" tabindex="0" aria-label="What is this?">?</span></label>
            <div class="inputwrap"><input id="brAge" type="text" inputmode="decimal" data-num data-step="1" min="30" max="59" data-nonneg value="50"><span class="affix">age</span></div>
          </div>
          <div class="field">
            <label for="brStatus">Filing status</label>
            <select id="brStatus">
              <option value="m" selected>Married filing jointly</option>
              <option value="s">Single</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="brState">State</label>
          <select id="brState"></select>
        </div>
        <div class="field">
          <label for="brSpend">Yearly spending, after tax<span class="tipdot" data-tip="brspend" role="button" tabindex="0" aria-label="What is this?">?</span></label>
          <div class="inputwrap"><span class="affix">$</span><input id="brSpend" type="text" inputmode="decimal" data-money data-nonneg value="60,000"><span class="affix">/yr</span></div>
          <div class="hint" id="brSpendNote"></div>
        </div>

        <div class="field" style="margin-top:8px"><div class="hint" style="margin:0;font-weight:600;color:var(--text)">Your accounts at retirement</div></div>
        <div class="field">
          <label for="brTrad">Traditional 401(k) / IRA<span class="tipdot" data-tip="brtrad" role="button" tabindex="0" aria-label="What is this?">?</span></label>
          <div class="inputwrap"><span class="affix">$</span><input id="brTrad" type="text" inputmode="decimal" data-money data-nonneg value="1,000,000"></div>
        </div>
        <div class="field" id="brK401Wrap">
          <label for="brK401">Of that, in the 401(k) you're leaving<span class="tipdot" data-tip="brk401" role="button" tabindex="0" aria-label="What is this?">?</span></label>
          <div class="inputwrap"><span class="affix">$</span><input id="brK401" type="text" inputmode="decimal" data-money data-nonneg value="400,000"></div>
        </div>
        <div class="two">
          <div class="field">
            <label for="brRoth">Roth 401(k) / IRA</label>
            <div class="inputwrap"><span class="affix">$</span><input id="brRoth" type="text" inputmode="decimal" data-money data-nonneg value="150,000"></div>
          </div>
          <div class="field">
            <label for="brRothBasis">Of that, contributions<span class="tipdot" data-tip="brrothbasis" role="button" tabindex="0" aria-label="What is this?">?</span></label>
            <div class="inputwrap"><span class="affix">$</span><input id="brRothBasis" type="text" inputmode="decimal" data-money data-nonneg value="90,000"></div>
          </div>
        </div>
        <div class="two">
          <div class="field">
            <label for="brBrok">Brokerage and cash</label>
            <div class="inputwrap"><span class="affix">$</span><input id="brBrok" type="text" inputmode="decimal" data-money data-nonneg value="450,000"></div>
          </div>
          <div class="field">
            <label for="brBasis">Cost basis<span class="tipdot" data-tip="brbasis" role="button" tabindex="0" aria-label="What is this?">?</span></label>
            <div class="inputwrap"><input id="brBasis" type="text" inputmode="decimal" data-num data-step="5" min="0" max="100" data-nonneg value="60"><span class="affix">% of balance</span></div>
          </div>
        </div>
        <div class="two">
          <div class="field">
            <label for="brG457">Governmental 457(b)<span class="tipdot" data-tip="br457" role="button" tabindex="0" aria-label="What is this?">?</span></label>
            <div class="inputwrap"><span class="affix">$</span><input id="brG457" type="text" inputmode="decimal" data-money data-nonneg value="0"></div>
          </div>
          <div class="field">
            <label for="brStock">Stocks<span class="tipdot" data-tip="brstock" role="button" tabindex="0" aria-label="What is this?">?</span></label>
            <div class="inputwrap"><input id="brStock" type="text" inputmode="decimal" data-num data-step="5" min="0" max="100" data-nonneg value="70"><span class="affix">%</span></div>
          </div>
        </div>

        <div class="field" style="margin-top:8px"><div class="hint" style="margin:0;font-weight:600;color:var(--text)">Income</div></div>
        <div class="two">
          <div class="field">
            <label for="brWork">Part-time work <span class="opt">optional</span></label>
            <div class="inputwrap"><span class="affix">$</span><input id="brWork" type="text" inputmode="decimal" data-money data-nonneg value="0"><span class="affix">/yr</span></div>
          </div>
          <div class="field">
            <label for="brWorkUntil">Until</label>
            <div class="inputwrap"><input id="brWorkUntil" type="text" inputmode="decimal" data-num data-step="1" min="30" max="80" data-nonneg value="55"><span class="affix">age</span></div>
          </div>
        </div>

        <div class="field" style="margin-top:8px"><div class="hint" style="margin:0;font-weight:600;color:var(--text)">Health insurance</div></div>
        <div class="field">
          <label for="brAca">Premiums<span class="tipdot" data-tip="braca" role="button" tabindex="0" aria-label="What is this?">?</span></label>
          <select id="brAca">
            <option value="1" selected>ACA plan, with the subsidy your income earns</option>
            <option value="0">Leave health insurance out</option>
          </select>
        </div>
        <div class="two" id="brAcaWrap">
          <div class="field">
            <label for="brHousehold">Household size</label>
            <div class="inputwrap"><input id="brHousehold" type="text" inputmode="decimal" data-num data-step="1" min="1" max="10" data-nonneg value="2"><span class="affix">people</span></div>
          </div>
          <div class="field">
            <label for="brPremium">Benchmark premium <span class="opt">optional</span><span class="tipdot" data-tip="brpremium" role="button" tabindex="0" aria-label="What is this?">?</span></label>
            <div class="inputwrap"><span class="affix">$</span><input id="brPremium" type="text" inputmode="decimal" data-money data-nonneg value="" placeholder="estimate"><span class="affix">/mo</span></div>
          </div>
        </div>

        <div class="field" style="margin-top:8px"><div class="hint" style="margin:0;font-weight:600;color:var(--text)">How the plans work</div></div>
        <div class="field">
          <label for="brFill">Blended plan converts<span class="tipdot" data-tip="brfill" role="button" tabindex="0" aria-label="What is this?">?</span></label>
          <select id="brFill">
            <option value="auto" selected>Automatic: whatever holds up best</option>
            <option value="none">Nothing: no conversions</option>
            <option value="need">Only what the ladder needs</option>
            <option value="zero">Up to the standard deduction (no tax)</option>
            <option value="b10">To the top of the 10% bracket</option>
            <option value="b12">To the top of the 12% bracket</option>
            <option value="aca">Up to the ACA subsidy cliff</option>
          </select>
        </div>
        <div class="two">
          <div class="field">
            <label for="brSeppMethod">72(t) method<span class="tipdot" data-tip="brseppmethod" role="button" tabindex="0" aria-label="What is this?">?</span></label>
            <select id="brSeppMethod">
              <option value="amort" selected>Amortization</option>
              <option value="rmd">RMD</option>
            </select>
          </div>
          <div class="field">
            <label for="brSeppRate">72(t) interest rate<span class="tipdot" data-tip="brsepprate" role="button" tabindex="0" aria-label="What is this?">?</span></label>
            <div class="inputwrap"><input id="brSeppRate" type="text" inputmode="decimal" data-num data-step="0.25" min="0" max="12" data-nonneg value="5"><span class="affix">%</span></div>
          </div>
        </div>

        <div class="derived">
          <div><span>Locked until 59½</span><span class="num" id="brLockYears"></span></div>
          <div><span>Rule of 55<span class="tipdot" data-tip="brk401" role="button" tabindex="0" aria-label="What is this?">?</span></span><span class="num" id="brR55State"></span></div>
          <div><span>Most 72(t) could pay</span><span class="num" id="brSeppMax"></span></div>
          <div><span>Average return, this mix<span class="tipdot" data-tip="brsteady" role="button" tabindex="0" aria-label="What is this?">?</span></span><span class="num" id="brSteadyRet"></span></div>
        </div>
      </div>
    </div>
  </aside>
