  <aside id="asideCollege" hidden>
    <div class="panel inputs">
      <h2>College plan</h2>
      <div class="body">
        <div class="field">
          <label for="clPreset">School type<span class="tipdot" data-tip="schooltype" role="button" tabindex="0" aria-label="What is this?">?</span></label>
          <select id="clPreset">
            <option value="27000">Public in-state · ~$27,000/yr</option>
            <option value="59000">Private non-profit · ~$59,000/yr</option>
            <option value="82000">Elite / Ivy · ~$82,000/yr</option>
            <option value="0">Custom</option>
          </select>
        </div>
        <div class="field">
          <label for="clCost">Annual cost today</label>
          <div class="inputwrap"><span class="affix">$</span><input id="clCost" type="text" inputmode="decimal" data-money data-nonneg value="27000"></div>
        </div>
        <div class="two">
          <div class="field">
            <label for="clYears">Years until college</label>
            <div class="inputwrap"><input id="clYears" type="text" inputmode="decimal" data-num data-step="1" min="0" max="25" data-nonneg value="18"><span class="affix">yrs</span></div>
          </div>
          <div class="field">
            <label for="clCollegeYrs">Years of college</label>
            <div class="inputwrap"><input id="clCollegeYrs" type="text" inputmode="decimal" data-num data-step="1" min="1" max="8" data-nonneg value="4"><span class="affix">yrs</span></div>
          </div>
        </div>
        <div class="field">
          <label for="clSaved">Currently saved</label>
          <div class="inputwrap"><span class="affix">$</span><input id="clSaved" type="text" inputmode="decimal" data-money data-nonneg value="0"></div>
        </div>
        <div class="two">
          <div class="field">
            <label for="clReturn">Investment return</label>
            <div class="inputwrap"><input id="clReturn" type="text" inputmode="decimal" data-num data-step="0.5" min="0" data-nonneg value="6"><span class="affix">%/yr</span></div>
          </div>
          <div class="field">
            <label for="clInfl">Tuition inflation<span class="tipdot" data-tip="tuitioninfl" role="button" tabindex="0" aria-label="What is this?">?</span></label>
            <div class="inputwrap"><input id="clInfl" type="text" inputmode="decimal" data-num data-step="0.5" min="0" data-nonneg value="4"><span class="affix">%/yr</span></div>
          </div>
        </div>
        <div class="derived">
          <div><span>What you've saved grows to</span><span class="num" id="clSavGrow"></span></div>
        </div>
      </div>
    </div>
  </aside>
  <div class="stack" id="tab-college" hidden>
    <div class="panel">
      <div class="headline">
        <div><div class="k">Save per month</div><div class="v gold" id="clMonthly">—</div><div class="note" id="clMonthlyNote"></div></div>
        <div><div class="k">Total projected cost</div><div class="v" id="clTotalOut">—</div><div class="note" id="clTotalNote"></div></div>
        <div><div class="k">Needed when college starts<span class="tipdot" data-tip="collegepv" role="button" tabindex="0" aria-label="What is this?">?</span></div><div class="v" id="clShortOut">—</div><div class="note" id="clShortNote"></div></div>
      </div>
    </div>
    <div class="panel">
      <h2>Savings over time</h2>
      <div class="chartwrap" id="chartWrapCl"><svg id="chartCl" viewBox="0 0 900 340" preserveAspectRatio="none" role="img" aria-label="College savings projection"></svg><div class="tip" id="tipCl"></div></div>
      <div class="legend" id="legendCl"></div>
    </div>
    <div class="panel">
      <h2>Year by year</h2>
      <div class="swipehint">Swipe the table sideways to see every column.</div>
      <div class="scroll"><table id="clTable"><thead><tr><th>Year</th><th>Balance</th><th>You added</th><th>Growth</th><th>Projected cost</th></tr></thead><tbody></tbody></table></div>
    </div>
  </div>
