  <aside id="asideHC" hidden>
    <div class="panel inputs">
      <h2>Your situation</h2>
      <div class="body">
        <div class="field">
          <label for="hcRetireAge">Retirement age</label>
          <div class="inputwrap"><input id="hcRetireAge" type="text" inputmode="decimal" data-num min="40" max="75" value="62"><span class="affix">age</span></div>
        </div>
        <div class="two">
          <div class="field">
            <label for="hcStatus">Filing status</label>
            <select id="hcStatus">
              <option value="s">Single</option>
              <option value="m">Married</option>
            </select>
          </div>
          <div class="field">
            <label for="hcHousehold">Household</label>
            <select id="hcHousehold">
              <option value="1">1 person</option>
              <option value="2" selected>2 people</option>
              <option value="3">3 people</option>
              <option value="4">4 people</option>
              <option value="5">5 people</option>
              <option value="6">6 people</option>
            </select>
          </div>
        </div>
        <div class="field" id="hcSpouseAgeWrap" hidden>
          <label for="hcSpouseAge">Spouse's age then<span class="tipdot" data-tip="hcspouseage" role="button" tabindex="0" aria-label="What is this?">?</span></label>
          <div class="inputwrap"><input id="hcSpouseAge" type="text" inputmode="decimal" data-num min="21" max="90" value="62"><span class="affix">age</span></div>
        </div>
        <div class="field">
          <label for="hcState">State</label>
          <select id="hcState">
            <option value="AL">Alabama</option>
            <option value="AK">Alaska</option>
            <option value="AZ">Arizona</option>
            <option value="AR">Arkansas</option>
            <option value="CA">California</option>
            <option value="CO">Colorado</option>
            <option value="CT">Connecticut</option>
            <option value="DC">DC</option>
            <option value="DE">Delaware</option>
            <option value="FL">Florida</option>
            <option value="GA">Georgia</option>
            <option value="HI">Hawaii</option>
            <option value="ID">Idaho</option>
            <option value="IL" selected>Illinois</option>
            <option value="IN">Indiana</option>
            <option value="IA">Iowa</option>
            <option value="KS">Kansas</option>
            <option value="KY">Kentucky</option>
            <option value="LA">Louisiana</option>
            <option value="ME">Maine</option>
            <option value="MD">Maryland</option>
            <option value="MA">Massachusetts</option>
            <option value="MI">Michigan</option>
            <option value="MN">Minnesota</option>
            <option value="MS">Mississippi</option>
            <option value="MO">Missouri</option>
            <option value="MT">Montana</option>
            <option value="NE">Nebraska</option>
            <option value="NV">Nevada</option>
            <option value="NH">New Hampshire</option>
            <option value="NJ">New Jersey</option>
            <option value="NM">New Mexico</option>
            <option value="NY">New York</option>
            <option value="NC">North Carolina</option>
            <option value="ND">North Dakota</option>
            <option value="OH">Ohio</option>
            <option value="OK">Oklahoma</option>
            <option value="OR">Oregon</option>
            <option value="PA">Pennsylvania</option>
            <option value="RI">Rhode Island</option>
            <option value="SC">South Carolina</option>
            <option value="SD">South Dakota</option>
            <option value="TN">Tennessee</option>
            <option value="TX">Texas</option>
            <option value="UT">Utah</option>
            <option value="VT">Vermont</option>
            <option value="VA">Virginia</option>
            <option value="WA">Washington</option>
            <option value="WV">West Virginia</option>
            <option value="WI">Wisconsin</option>
            <option value="WY">Wyoming</option>
          </select>
        </div>
        <div class="field">
          <label for="hcIncome">Retirement MAGI<span class="tipdot" data-tip="hcincome" role="button" tabindex="0" aria-label="What is this?">?</span></label>
          <div class="inputwrap"><span class="affix">$</span><input id="hcIncome" type="text" inputmode="decimal" data-money data-nonneg></div>
          <button class="btn mini" type="button" id="hcCopyTax" style="margin-top:6px">Copy from Income Tax</button>
          <button class="btn mini" type="button" id="hcGoTax" style="margin-top:4px">Open Income Tax</button>
        </div>
        <div class="field">
          <label for="hcSS">Social Security received <span class="opt">optional</span><span class="tipdot" data-tip="hcss" role="button" tabindex="0" aria-label="What is this?">?</span></label>
          <div class="inputwrap"><span class="affix">$</span><input id="hcSS" type="text" inputmode="decimal" data-money data-nonneg value=""><span class="affix">/yr</span></div>
        </div>
        <div class="field">
          <label for="hcManualPremium">ACA benchmark premium<span class="tipdot" data-tip="hcbenchmark" role="button" tabindex="0" aria-label="What is this?">?</span></label>
          <div class="inputwrap"><span class="affix">$</span><input id="hcManualPremium" type="text" inputmode="decimal" data-money data-nonneg placeholder="state est. if blank"></div>
        </div>
      </div>
    </div>
  </aside>
